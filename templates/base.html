{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site_profile.tagline }}">
  <title>{% block title %}{{ site_profile.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="shell header">
    <a class="brand" href="{% url 'about' %}">{{ site_profile.name }}</a>
    <button class="menu" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
    <nav aria-label="Main navigation">
      <a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
      <a href="{% url 'cv' %}" {% if request.resolver_match.url_name == 'cv' %}aria-current="page"{% endif %}>CV</a>
      <a href="{% url 'blog' %}" {% if 'blog' in request.path %}aria-current="page"{% endif %}>Writing</a>
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer class="shell footer"><span>© {% now "Y" %} {{ site_profile.name }}</span><a href="/admin/">Site editor</a></footer>
  <script src="{% static 'js/site.js' %}"></script>
</body></html>
