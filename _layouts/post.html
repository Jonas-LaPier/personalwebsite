---
layout: default
nav: blog
---
<article class="article">
  <a class="back" href="{{ '/blog/' | relative_url }}">← All writing</a>
  <header>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="tagline">{{ page.excerpt_text }}</p>{% endif %}
  </header>
  {% if page.cover_image %}<img class="cover" src="{{ page.cover_image | relative_url }}" alt="{{ page.cover_alt | default: '' }}">{% endif %}
  <div class="prose article-body">{{ content }}</div>
</article>
